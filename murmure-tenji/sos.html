<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />

  <!-- =========================================================================
    保木平珈琲 Murmure｜展示用iPad Webアプリ「困ったときのSOS」（v7）
    - 1080×786px 固定キャンバス・スクロールなし・全サブ画面共通デザイン
    - 1問チェック対象（シワシワ／急に透けてぶよぶよ／下の葉）は「未選択」で開き、
      回答前は「まず確かめること」を表示。タップ後に対処・NG行動を表示する
    - 「葉が急に透けて、ぶよぶよになった」で凍害（冷え込んだ翌朝）と蒸れ・腐敗を分離
    - 関連ガイド遷移時に &sym=〇〇 を引き継ぎ、各ページの「‹ もどる」で元の症状へ復帰可能
    - 関連ガイドの表記を「多肉の育て方を見る」へ統一
    - 左上2ボタン「‹ もどる」「⌂ トップへ」常時表示、無操作5分（300000ms）でトップ自動復帰
  ========================================================================= -->

  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="多肉の育て方" />
  <meta name="format-detection" content="telephone=no" />
  <link rel="manifest" href="manifest.json" />
  <link rel="apple-touch-icon" sizes="180x180" href="images/apple-touch-icon.png" />
  <link rel="icon" type="image/png" sizes="512x512" href="images/icon-512.png" />

  <title>Murmure｜困ったときのSOS</title>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500;1,600&family=Shippori+Mincho:wght@400;500;600;700&family=Zen+Maru+Gothic:wght@500;700&display=swap" rel="stylesheet" />

  <style>
    :root {
      --bg-paper: #f6f0e4;
      --card-paper: #fffdf8;
      --ink-main: #2d1f16;
      --ink-sub: #3a2b20;
      --ink-muted: #625344;
      --line-soft: #dfd0b6;
      --line-hair: rgba(180, 162, 134, 0.44);

      --sos-color: #c43b2b;
      --sos-deep: #8f1d14;
      --sos-dark: #9c2719;
      --sos-soft: #fdf2f0;
      --sos-border: #dfa29a;

      --ok-color: #5b7a46;
      --ok-deep: #3d572b;
      --ok-soft: #f1f6ec;
      --ok-border: #b8cca8;

      --check-color: #3f7896;
      --check-deep: #245670;
      --check-soft: #eef6fa;
      --check-border: #b8d3e0;

      --amber-color: #b86b2b;
      --amber-deep: #854816;
      --amber-soft: #fdf6ee;

      --shadow-soft: 0 2px 10px rgba(72, 54, 38, 0.055);
      --font-serif: "Shippori Mincho", "Hiragino Mincho ProN", "Yu Mincho", serif;
      --font-ui: "Zen Maru Gothic", "Hiragino Maru Gothic ProN", sans-serif;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
      -webkit-user-select: none;
      user-select: none;
      -webkit-touch-callout: none;
    }

    button, a {
      touch-action: manipulation;
    }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #e9dfd0;
      font-family: var(--font-serif);
      color: var(--ink-main);
    }

    .viewport-wrapper {
      position: fixed;
      inset: 0;
      width: 100vw;
      height: 100vh;
      height: 100dvh;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .canvas {
      position: relative;
      width: 1080px;
      height: 786px;
      min-width: 1080px;
      min-height: 786px;
      background: linear-gradient(135deg, #f9f5e9, #f2ead9);
      transform-origin: center center;
      padding: 15px 22px 20px;
      display: flex;
      flex-direction: column;
      gap: 14px;
      box-shadow: 0 12px 36px rgba(59, 45, 35, 0.14);
      overflow: hidden;
    }

    .canvas::before {
      content: "";
      position: absolute;
      inset: 0;
      pointer-events: none;
      background-image: radial-gradient(rgba(110, 88, 66, 0.045) 1px, transparent 0);
      background-size: 16px 16px;
      opacity: 0.75;
    }

    /* ================= 1. 上部ヘッダー（全サブ画面統一） ================= */
    .page-header {
      position: relative;
      z-index: 2;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 14px;
      flex-shrink: 0;
      border-bottom: 1px solid #d6cbb5;
      padding-bottom: 8px;
    }

    .header-left {
      display: flex;
      align-items: center;
      gap: 14px;
    }

    .header-nav-group {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      flex-shrink: 0;
    }

    .back-btn {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      padding: 5px 15px 5px 11px;
      background: rgba(255, 253, 248, 0.85);
      border: 1px solid #d8cab3;
      border-bottom: 2px solid #cbbba0;
      border-radius: 999px;
      font-family: var(--font-ui);
      font-size: 14.5px;
      font-weight: 700;
      color: var(--ink-main);
      cursor: pointer;
      flex-shrink: 0;
      transition: transform 0.12s ease;
    }

    .back-btn:active { transform: translateY(1px) scale(0.97); }

    .back-arrow {
      font-size: 20px;
      line-height: 1;
      color: var(--sos-color);
    }

    .home-btn {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      padding: 5px 13px 5px 11px;
      background: rgba(255, 253, 248, 0.72);
      border: 1px solid #d8cab3;
      border-bottom: 2px solid #cbbba0;
      border-radius: 999px;
      font-family: var(--font-ui);
      font-size: 13.6px;
      font-weight: 700;
      color: var(--ink-sub);
      cursor: pointer;
      flex-shrink: 0;
      transition: transform 0.12s ease;
    }

    .home-btn:active { transform: translateY(1px) scale(0.97); }

    .home-btn svg {
      width: 15px;
      height: 15px;
      color: var(--sos-color);
      display: block;
      flex-shrink: 0;
    }

    .title-wrap {
      display: flex;
      align-items: baseline;
      gap: 12px;
    }

    .page-title {
      font-family: var(--font-serif);
      font-size: 26px;
      font-weight: 700;
      letter-spacing: 0.05em;
      line-height: 1.12;
    }

    .page-en {
      font-family: "Cormorant Garamond", Georgia, serif;
      font-style: italic;
      font-size: 16.5px;
      font-weight: 600;
      color: #6b5f47;
    }

    .header-hint {
      font-family: var(--font-ui);
      font-size: 13.6px;
      font-weight: 500;
      color: var(--ink-muted);
      white-space: nowrap;
    }

    /* ================= 2. メイン2カラム構成（左：6症状メニュー／右：対処ボード） ================= */
    .sos-workspace {
      position: relative;
      z-index: 2;
      flex: 1 1 auto;
      min-height: 0;
      display: grid;
      grid-template-columns: 336px 1fr;
      gap: 16px;
    }

    .symptom-col {
      display: flex;
      flex-direction: column;
      gap: 8px;
      min-height: 0;
    }

    .col-lead {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 0 2px;
      flex-shrink: 0;
    }

    .col-step-num {
      width: 24px;
      height: 24px;
      border-radius: 50%;
      background: var(--sos-color);
      color: #ffffff;
      font-family: var(--font-ui);
      font-size: 13.5px;
      font-weight: 700;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }

    .col-lead-title {
      font-family: var(--font-ui);
      font-size: 15.8px;
      font-weight: 700;
      color: var(--ink-main);
    }

    .symptom-list {
      flex: 1 1 auto;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      gap: 8px;
      min-height: 0;
    }

    .symptom-btn {
      flex: 1 1 0;
      width: 100%;
      background: var(--card-paper);
      border: 1.5px solid var(--line-soft);
      border-bottom: 3px solid #d2c1a4;
      border-radius: 12px;
      padding: 9px 13px 9px 12px;
      display: flex;
      align-items: center;
      gap: 11px;
      text-align: left;
      cursor: pointer;
      transition: transform 0.1s ease, background-color 0.12s ease, border-color 0.12s ease;
      position: relative;
    }

    .symptom-btn:active {
      transform: translateY(1px) scale(0.99);
    }

    .symptom-btn.is-active {
      background: linear-gradient(90deg, #fff6f4 0%, #fffdf8 100%);
      border-color: var(--sos-color);
      border-left: 6px solid var(--sos-color);
      border-bottom: 3px solid var(--sos-dark);
      box-shadow: 0 4px 12px rgba(196, 59, 43, 0.14);
    }

    .sym-icon-wrap {
      width: 44px;
      height: 44px;
      border-radius: 10px;
      background: #f5eee2;
      border: 1px solid #e2d4bc;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }

    .symptom-btn.is-active .sym-icon-wrap {
      background: #fcebe8;
      border-color: #e4afa7;
    }

    .sym-icon-wrap svg {
      width: 28px;
      height: 28px;
      display: block;
    }

    .sym-btn-text {
      display: flex;
      flex-direction: column;
      gap: 2px;
      min-width: 0;
      flex: 1;
    }

    .sym-btn-title {
      font-family: var(--font-ui);
      font-size: 16.4px;
      font-weight: 700;
      color: var(--ink-main);
      line-height: 1.24;
      white-space: nowrap;
    }

    .symptom-btn.is-active .sym-btn-title {
      color: var(--sos-deep);
    }

    .sym-btn-sub {
      font-family: var(--font-ui);
      font-size: 12.6px;
      font-weight: 500;
      color: var(--ink-muted);
      line-height: 1.2;
      white-space: nowrap;
    }

    .sym-btn-arrow {
      font-family: var(--font-ui);
      font-size: 20px;
      font-weight: 700;
      color: #c2b093;
      line-height: 1;
      flex-shrink: 0;
    }

    .symptom-btn.is-active .sym-btn-arrow {
      color: var(--sos-color);
    }

    /* ================= 右カラム：診断＆対処パネル ================= */
    .detail-col {
      display: flex;
      flex-direction: column;
      gap: 10px;
      min-width: 0;
      min-height: 0;
    }

    .detail-card {
      flex: 1 1 auto;
      background: var(--card-paper);
      border: 1.5px solid var(--line-soft);
      border-top: 5px solid var(--sos-color);
      border-radius: 14px;
      padding: 16px 21px 16px;
      box-shadow: var(--shadow-soft);
      display: flex;
      flex-direction: column;
      gap: 13px;
      min-height: 0;
      overflow: hidden;
    }

    .detail-head {
      display: flex;
      align-items: center;
      gap: 13px;
      padding-bottom: 11px;
      border-bottom: 1px dashed var(--line-hair);
      flex-shrink: 0;
    }

    .detail-icon-big {
      width: 54px;
      height: 54px;
      border-radius: 13px;
      background: #fdf4f2;
      border: 1.5px solid #e6b8b0;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }

    .detail-icon-big svg {
      width: 36px;
      height: 36px;
      display: block;
    }

    .detail-title-group {
      display: flex;
      flex-direction: column;
      gap: 3px;
      min-width: 0;
    }

    .detail-title {
      font-family: var(--font-ui);
      font-size: 23.5px;
      font-weight: 700;
      color: var(--ink-main);
      line-height: 1.2;
    }

    .detail-term {
      font-family: var(--font-ui);
      font-size: 13.4px;
      font-weight: 700;
      color: var(--ink-muted);
      line-height: 1.2;
    }

    .check-box {
      background: var(--check-soft);
      border: 1.5px solid var(--check-border);
      border-radius: 11px;
      padding: 11px 14px;
      display: flex;
      flex-direction: column;
      gap: 9px;
      flex-shrink: 0;
    }

    .check-box.is-hidden {
      display: none;
    }

    .check-q-row {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .check-q-badge {
      display: inline-flex;
      align-items: center;
      padding: 2.5px 9px;
      border-radius: 999px;
      background: var(--check-color);
      color: #ffffff;
      font-family: var(--font-ui);
      font-size: 12.2px;
      font-weight: 700;
      white-space: nowrap;
      flex-shrink: 0;
    }

    .check-q-text {
      font-family: var(--font-ui);
      font-size: 15.8px;
      font-weight: 700;
      color: var(--check-deep);
      line-height: 1.28;
    }

    .check-btn-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }

    .check-choice-btn {
      padding: 10px 12px;
      border-radius: 10px;
      background: #ffffff;
      border: 1.5px solid #9dc0d1;
      border-bottom: 3px solid #7fa6ba;
      font-family: var(--font-ui);
      font-size: 15px;
      font-weight: 700;
      color: var(--check-deep);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      line-height: 1.25;
      transition: transform 0.1s ease, background-color 0.12s ease;
    }

    .check-choice-btn:active { transform: translateY(1px) scale(0.98); }

    .check-choice-btn.is-selected {
      background: var(--check-color);
      border-color: var(--check-deep);
      border-bottom-color: #193e52;
      color: #ffffff;
      box-shadow: 0 3px 8px rgba(36, 86, 112, 0.22);
    }

    .precheck-panel {
      flex: 1 1 auto;
      background: linear-gradient(180deg, #faf6ee 0%, #f5efe2 100%);
      border: 1.5px dashed #ccb897;
      border-radius: 12px;
      padding: 18px 22px;
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      justify-content: flex-start;
      gap: 11px;
    }

    .precheck-panel.is-hidden {
      display: none;
    }

    .precheck-pill {
      display: inline-flex;
      align-items: center;
      padding: 4px 12px;
      border-radius: 999px;
      background: var(--amber-color);
      color: #ffffff;
      font-family: var(--font-ui);
      font-size: 13px;
      font-weight: 700;
      letter-spacing: 0.04em;
    }

    .precheck-lead {
      font-family: var(--font-ui);
      font-size: 20px;
      font-weight: 700;
      color: var(--ink-main);
      line-height: 1.5;
    }

    .precheck-sub {
      font-family: var(--font-ui);
      font-size: 14.8px;
      font-weight: 500;
      color: var(--ink-sub);
      line-height: 1.55;
    }

    .precheck-tap-hint {
      margin-top: 4px;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 6px 13px;
      border-radius: 999px;
      background: rgba(63, 120, 150, 0.12);
      color: var(--check-deep);
      font-family: var(--font-ui);
      font-size: 13.8px;
      font-weight: 700;
    }

    .result-body {
      flex: 1 1 auto;
      min-height: 0;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .result-body.is-hidden {
      display: none;
    }

    .cause-box {
      background: #faf6ee;
      border: 1px solid #e3d6c0;
      border-left: 5px solid var(--amber-color);
      border-radius: 10px;
      padding: 10px 14px;
      display: flex;
      flex-direction: column;
      gap: 3px;
      flex-shrink: 0;
    }

    .cause-box.is-urgent {
      background: #fff4f2;
      border-color: #e4b5ae;
      border-left-color: var(--sos-color);
    }

    .cause-box.is-safe {
      background: var(--ok-soft);
      border-color: var(--ok-border);
      border-left-color: var(--ok-color);
    }

    .cause-label {
      font-family: var(--font-ui);
      font-size: 12.2px;
      font-weight: 700;
      color: var(--amber-deep);
      letter-spacing: 0.03em;
    }

    .cause-box.is-urgent .cause-label { color: var(--sos-deep); }
    .cause-box.is-safe .cause-label { color: var(--ok-deep); }

    .cause-title {
      font-family: var(--font-ui);
      font-size: 18.2px;
      font-weight: 700;
      color: var(--ink-main);
      line-height: 1.28;
    }

    .cause-desc {
      font-family: var(--font-ui);
      font-size: 14.2px;
      font-weight: 500;
      color: var(--ink-sub);
      line-height: 1.44;
    }

    .action-grid {
      flex: 1 1 auto;
      min-height: 0;
      display: grid;
      grid-template-columns: 1.42fr 0.88fr;
      gap: 13px;
      align-items: stretch;
    }

    .do-card {
      background: linear-gradient(180deg, #f5faf1 0%, #edf5e7 100%);
      border: 2px solid #9ebc89;
      border-top: 5px solid var(--ok-color);
      border-radius: 12px;
      padding: 13px 16px;
      display: flex;
      flex-direction: column;
      gap: 9px;
      box-shadow: 0 3px 10px rgba(61, 87, 43, 0.08);
    }

    .box-head-pill {
      align-self: flex-start;
      display: inline-flex;
      align-items: center;
      gap: 5px;
      padding: 3.5px 12px;
      border-radius: 999px;
      font-family: var(--font-ui);
      font-size: 13.4px;
      font-weight: 700;
      color: #ffffff;
      background: var(--ok-color);
      letter-spacing: 0.03em;
    }

    .do-list {
      list-style: none;
      display: flex;
      flex-direction: column;
      gap: 11px;
      flex: 1;
      justify-content: flex-start;
      padding-top: 2px;
    }

    .do-item {
      display: flex;
      align-items: flex-start;
      gap: 9px;
      font-family: var(--font-ui);
      font-size: 15.6px;
      font-weight: 500;
      color: var(--ink-main);
      line-height: 1.48;
    }

    .do-item strong {
      font-weight: 700;
      color: var(--ok-deep);
    }

    .do-num {
      width: 24px;
      height: 24px;
      border-radius: 50%;
      background: var(--ok-color);
      color: #ffffff;
      font-size: 13.4px;
      font-weight: 700;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      margin-top: 1px;
    }

    .ng-card {
      background: linear-gradient(180deg, #fff6f5 0%, #fcece9 100%);
      border: 1.5px solid var(--sos-border);
      border-top: 4px solid var(--sos-color);
      border-radius: 12px;
      padding: 13px 15px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .ng-card .box-head-pill {
      background: var(--sos-color);
      font-size: 12.8px;
    }

    .ng-main {
      font-family: var(--font-ui);
      font-size: 16.6px;
      font-weight: 700;
      color: var(--sos-deep);
      line-height: 1.32;
    }

    .ng-desc {
      font-family: var(--font-ui);
      font-size: 14px;
      font-weight: 500;
      color: #4a241f;
      line-height: 1.46;
    }

    .related-bar {
      flex: 0 0 auto;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }

    .related-btn {
      display: inline-flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      padding: 11px 16px;
      border-radius: 11px;
      background: var(--card-paper);
      border: 1.5px solid #d4c4a8;
      border-bottom: 3px solid #c2ae8c;
      font-family: var(--font-ui);
      font-size: 15px;
      font-weight: 700;
      color: var(--ink-main);
      cursor: pointer;
      box-shadow: var(--shadow-soft);
      transition: transform 0.12s ease;
    }

    .related-btn:active { transform: translateY(1px) scale(0.98); }

    .related-btn.is-primary {
      background: var(--ok-color);
      border-color: var(--ok-deep);
      border-bottom-color: #2f4620;
      color: #ffffff;
    }

    .rel-left {
      display: flex;
      align-items: center;
      gap: 8px;
      min-width: 0;
      white-space: nowrap;
    }

    .rel-tag {
      padding: 2px 8px;
      border-radius: 999px;
      background: #f1eadc;
      color: var(--ink-muted);
      font-size: 12px;
      font-weight: 700;
      white-space: nowrap;
    }

    .related-btn.is-primary .rel-tag {
      background: rgba(255, 255, 255, 0.22);
      color: #ffffff;
    }

    .rel-arrow {
      width: 22px;
      height: 22px;
      border-radius: 50%;
      background: #f1eadc;
      color: var(--ink-sub);
      font-size: 16px;
      font-weight: 700;
      display: inline-flex;

    const causeBoxEl = document.getElementById("causeBox");
    const causeLabelEl = document.getElementById("causeLabel");
    const causeTitleEl = document.getElementById("causeTitle");
    const causeDescEl = document.getElementById("causeDesc");
    const doListEl = document.getElementById("doList");
    const ngMainEl = document.getElementById("ngMain");
    const ngDescEl = document.getElementById("ngDesc");
    const relatedBarEl = document.getElementById("relatedBar");

    function renderSymptomList() {
      symptomListEl.innerHTML = SYMPTOMS.map((s) => `
        <button class="symptom-btn ${s.id === currentSymId ? "is-active" : ""}" type="button" data-sym="${s.id}">
          <span class="sym-icon-wrap" aria-hidden="true">${s.icon}</span>
          <span class="sym-btn-text">
            <span class="sym-btn-title">${s.title}</span>
            <span class="sym-btn-sub">${s.sub}</span>
          </span>
          <span class="sym-btn-arrow" aria-hidden="true">›</span>
        </button>
      `).join("");
    }

    function renderDetail() {
      const s = SYMPTOMS.find((x) => x.id === currentSymId) || SYMPTOMS[0];
      detailIconEl.innerHTML = s.icon;
      detailTermEl.textContent = s.term;
      detailTitleEl.textContent = s.title;

      let activeData = s;

      if (s.check) {
        checkBoxEl.classList.remove("is-hidden");
        checkQuestionEl.textContent = s.check.question;
        const selectedId = choiceState[s.id] || null;
        checkChoicesEl.innerHTML = s.check.choices.map((c) => `
          <button class="check-choice-btn ${c.id === selectedId ? "is-selected" : ""}" type="button" data-choice="${c.id}">
            <span>${c.label}</span>
          </button>
        `).join("");

        if (!selectedId) {
          precheckPanelEl.classList.remove("is-hidden");
          resultBodyEl.classList.add("is-hidden");
          precheckLeadEl.textContent = s.check.precheckLead;
          precheckSubEl.textContent = s.check.precheckSub;
        } else {
          precheckPanelEl.classList.add("is-hidden");
          resultBodyEl.classList.remove("is-hidden");
          activeData = s.check.choices.find((c) => c.id === selectedId) || s.check.choices[0];
        }
      } else {
        checkBoxEl.classList.add("is-hidden");
        precheckPanelEl.classList.add("is-hidden");
        resultBodyEl.classList.remove("is-hidden");
      }

      if (!resultBodyEl.classList.contains("is-hidden")) {
        causeBoxEl.classList.remove("is-urgent", "is-safe");
        if (activeData.tone === "urgent") causeBoxEl.classList.add("is-urgent");
        if (activeData.tone === "safe") causeBoxEl.classList.add("is-safe");

        causeLabelEl.textContent = activeData.causeLabel;
        causeTitleEl.textContent = activeData.causeTitle;
        causeDescEl.textContent = activeData.causeDesc;

        doListEl.innerHTML = activeData.dos.map((d, idx) => `
          <li class="do-item">
            <span class="do-num" aria-hidden="true">${idx + 1}</span>
            <span>${d}</span>
          </li>
        `).join("");

        ngMainEl.textContent = activeData.ngMain;
        ngDescEl.textContent = activeData.ngDesc;
      }

      relatedBarEl.innerHTML = s.related.map((r) => `
        <button class="related-btn ${r.primary ? "is-primary" : ""}" type="button" data-nav-url="${r.nav}">
          <span class="rel-left">
            <span class="rel-tag">${r.tag}</span>
            <span>${r.label}</span>
          </span>
          <span class="rel-arrow" aria-hidden="true">›</span>
        </button>
      `).join("");
    }

    function selectSymptom(id) {
      if (!id || id === currentSymId) return;
      currentSymId = id;
      renderSymptomList();
      renderDetail();
    }

    function selectChoice(choiceId) {
      if (!choiceId) return;
      choiceState[currentSymId] = choiceId;
      renderDetail();
    }

    const pageParams = new URLSearchParams(window.location.search);
    const fromPage = pageParams.get("from") || "";

    function buildHomeUrl() {
      const qMonth = pageParams.get("month");
      return qMonth ? `index.html?month=${encodeURIComponent(qMonth)}` : "index.html";
    }

    function buildSimUrl(addFromSos = false) {
      const next = new URLSearchParams();
      if (addFromSos) {
        next.set("from", "sos");
        next.set("sym", currentSymId);
        if (choiceState[currentSymId]) next.set("choice", choiceState[currentSymId]);
        if (fromPage) next.set("sosFrom", fromPage);
      }
      ["type", "season", "light", "wind", "water", "month"].forEach((k) => {
        const v = pageParams.get(k);
        if (v) next.set(k, v);
      });
      const qs = next.toString();
      return qs ? `sim.html?${qs}` : "sim.html";
    }

    function buildBackUrl() {
      if (fromPage === "sim") return buildSimUrl(false);
      if (fromPage === "rules") {
        const qMonth = pageParams.get("month");
        return qMonth ? `rules.html?month=${encodeURIComponent(qMonth)}` : "rules.html";
      }
      if (fromPage === "soil") {
        const qMonth = pageParams.get("month");
        return qMonth ? `soil.html?month=${encodeURIComponent(qMonth)}` : "soil.html";
      }
      return buildHomeUrl();
    }

    function navigateWithParams(baseUrl) {
      if (!baseUrl) return;
      if (baseUrl === "sim.html") {
        window.location.href = buildSimUrl(true);
        return;
      }
      const next = new URLSearchParams();
      next.set("from", "sos");
      next.set("sym", currentSymId);
      if (choiceState[currentSymId]) next.set("choice", choiceState[currentSymId]);
      if (fromPage) next.set("sosFrom", fromPage);
      ["type", "season", "light", "wind", "water", "month"].forEach((k) => {
        const v = pageParams.get(k);
        if (v) next.set(k, v);
      });
      window.location.href = `${baseUrl}?${next.toString()}`;
    }

    function handleNavRole(role) {
      if (role === "back") window.location.href = buildBackUrl();
      else if (role === "home") window.location.href = buildHomeUrl();
    }

    let lastTapTs = 0;

    function handleInteractiveTarget(target) {
      if (!target) return false;
      const symBtn = target.closest("[data-sym]");
      if (symBtn) { selectSymptom(symBtn.dataset.sym); return true; }
      const choiceBtn = target.closest("[data-choice]");
      if (choiceBtn) { selectChoice(choiceBtn.dataset.choice); return true; }
      const navRoleBtn = target.closest("[data-nav-role]");
      if (navRoleBtn) { handleNavRole(navRoleBtn.dataset.navRole); return true; }
      const navUrlBtn = target.closest("[data-nav-url]");
      if (navUrlBtn) { navigateWithParams(navUrlBtn.dataset.navUrl); return true; }
      return false;
    }

    document.addEventListener("pointerdown", (e) => {
      if (e.pointerType === "mouse" && e.button !== 0) return;
      const now = Date.now();
      if (now - lastTapTs < 200) return;

      if (e.target && e.target.closest && handleInteractiveTarget(e.target)) {
        lastTapTs = now;
        e.preventDefault();
        return;
      }

      const x = e.clientX;
      const y = e.clientY;
      const allBtns = document.querySelectorAll("[data-sym], [data-choice], [data-nav-role], [data-nav-url]");
      for (const btn of allBtns) {
        const rect = btn.getBoundingClientRect();
        if (rect.width === 0 || rect.height === 0) continue;
        if (x >= rect.left && x <= rect.right && y >= rect.top && y <= rect.bottom) {
          lastTapTs = now;
          e.preventDefault();
          handleInteractiveTarget(btn);
          return;
        }
      }
    }, { capture: true, passive: false });

    document.addEventListener("click", (e) => {
      if (Date.now() - lastTapTs < 350) return;
      if (e.target && e.target.closest) handleInteractiveTarget(e.target);
    });

    // 無操作5分でトップ画面へ自動復帰
    let idleTimer = null;
    function resetIdleTimer() {
      clearTimeout(idleTimer);
      idleTimer = setTimeout(() => {
        window.location.href = "index.html";
      }, 300000);
    }
    ["pointerdown", "touchstart", "click", "keydown"].forEach((ev) => {
      window.addEventListener(ev, resetIdleTimer, { passive: true });
    });

    function fitCanvas() {
      const canvas = document.getElementById("appCanvas");
      const scale = Math.min(window.innerWidth / 1080, window.innerHeight / 786);
      if (window.CSS && CSS.supports && CSS.supports("zoom", "1")) {
        canvas.style.zoom = scale;
        canvas.style.transform = "none";
      } else {
        canvas.style.zoom = "";
        canvas.style.transform = `scale(${scale})`;
      }
    }

    window.addEventListener("resize", fitCanvas);
    window.addEventListener("orientationchange", fitCanvas);

    const initSym = pageParams.get("sym");
    if (initSym && SYMPTOMS.some((s) => s.id === initSym)) {
      currentSymId = initSym;
    }
    const initChoice = pageParams.get("choice");
    const initSymObj = SYMPTOMS.find((s) => s.id === currentSymId);
    if (initChoice && initSymObj && initSymObj.check && initSymObj.check.choices.some((c) => c.id === initChoice)) {
      choiceState[currentSymId] = initChoice;
    }
    renderSymptomList();
    renderDetail();
    fitCanvas();
    resetIdleTimer();
  </script>
</body>
</html>
