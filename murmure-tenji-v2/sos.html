<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />

  <!-- =========================================================================
    保木平珈琲 Murmure｜展示用iPad Webアプリ「困ったときのSOS」（v2・縦スクロール＆引き算版）
    - 左リスト：アイコン＋症状名のみのすっきりリスト
    - 右紙面：1問チェック → 結論（質問と同じ明朝見出し＋1行補足）→ 行動リスト（見出しなし）→ これはNG（淡赤ゾーン）
    - 右カード内を縦スクロール対応にし、下端で「これはNG」が見切れてスクロール可能と伝わる設計
    - 5つの基本ページ直リンク・sim.html からの症状引き継ぎ・戻り導線を完全維持
  ========================================================================= -->

  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="多肉の育て方" />
  <meta name="theme-color" content="#f6f0e4" />
  <meta name="format-detection" content="telephone=no" />
  <link rel="manifest" href="manifest.json" />
  <link rel="apple-touch-icon" sizes="180x180" href="images/apple-touch-icon.png" />
  <link rel="icon" type="image/png" sizes="512x512" href="images/icon-512.png" />

  <title>Murmure｜困ったときのSOS</title>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500;1,600&family=Shippori+Mincho:wght@500;600;700&family=Zen+Maru+Gothic:wght@400;500;700&display=swap" rel="stylesheet" />

  <style>
    :root {
      --bg-outer: #e9dfd0;
      --bg-paper: #f6f0e4;
      --card-paper: #fffdf8;
      --surface-muted: #f7f1e5;
      --ink-main: #2d1f16;
      --ink-sub: #4f3f33;
      --ink-muted: #786758;
      --line-soft: #d7c7ad;
      --line-strong: #c2ae8e;
      --line-hair: rgba(168, 148, 120, 0.42);

      --axis: #5e4736;
      --axis-dark: #453326;
      --axis-soft: #f2eadc;
      --axis-fill: #ebe0cc;

      --sos-color: #a63d28;
      --sos-deep: #7d2918;
      --sos-tint: #fcf3f0;
      --sos-bd: rgba(166, 61, 40, 0.28);

      --ok-color: #3f632d;
      --ok-deep: #2c4a1e;

      --check-color: #3a6882;
      --check-deep: #26495e;

      --shadow-soft: 0 2px 10px rgba(72, 54, 38, 0.055);
      --font-serif: "Shippori Mincho", "Hiragino Mincho ProN", "Yu Mincho", serif;
      --font-ui: "Zen Maru Gothic", "Hiragino Maru Gothic ProN", sans-serif;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
      -webkit-user-select: none;
      user-select: none;
      -webkit-touch-callout: none;
    }

    button, a {
      font: inherit;
      color: inherit;
      text-decoration: none;
      touch-action: manipulation;
    }

    button:focus-visible, a:focus-visible {
      outline: 3px solid #ab542c;
      outline-offset: -3px;
    }

    svg {
      display: block;
      flex-shrink: 0;
    }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: var(--bg-outer);
      font-family: var(--font-ui);
      color: var(--ink-main);
    }

    .viewport-wrapper {
      position: fixed;
      inset: 0;
      width: 100vw;
      height: 100vh;
      height: 100dvh;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .canvas {
      position: relative;
      width: 1080px;
      height: 786px;
      min-width: 1080px;
      min-height: 786px;
      background: linear-gradient(135deg, #f9f5e9, #f2ead9);
      transform-origin: center center;
      padding: 14px 24px 18px;
      display: flex;
      flex-direction: column;
      gap: 14px;
      box-shadow: 0 12px 36px rgba(59, 45, 35, 0.14);
      overflow: hidden;
    }

    .canvas::before {
      content: "";
      position: absolute;
      inset: 0;
      pointer-events: none;
      background-image: radial-gradient(rgba(110, 88, 66, 0.045) 1px, transparent 0);
      background-size: 16px 16px;
      opacity: 0.7;
    }

    /* ================= 1. 共通ヘッダー ================= */
    .page-header {
      position: relative;
      z-index: 2;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 14px;
      flex-shrink: 0;
      border-bottom: 1px solid var(--line-soft);
      padding-bottom: 8px;
    }

    .header-left {
      display: flex;
      align-items: center;
      gap: 16px;
    }

    .header-nav-group {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      flex-shrink: 0;
    }

    .back-btn,
    .home-btn {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      height: 40px;
      padding: 0 15px;
      background: var(--card-paper);
      border: 1px solid var(--line-soft);
      border-bottom: 2px solid var(--line-strong);
      border-radius: 10px;
      font-family: var(--font-ui);
      font-size: 14.5px;
      font-weight: 700;
      color: var(--ink-main);
      cursor: pointer;
      flex-shrink: 0;
      transition: background-color 0.12s ease, transform 0.08s ease;
    }

    .home-btn {
      background: var(--axis-soft);
      border-color: #cbbba6;
      border-bottom-color: #b39f86;
      color: var(--axis);
    }

    .back-btn:active,
    .home-btn:active {
      transform: translateY(1px);
      background: #ebe4d5;
    }

    .back-arrow {
      font-size: 19px;
      line-height: 1;
      color: var(--axis);
    }

    .home-btn svg {
      width: 15px;
      height: 15px;
      color: var(--axis);
    }

    .title-wrap {
      display: flex;
      align-items: baseline;
      gap: 12px;
    }

    .page-title {
      font-family: var(--font-serif);
      font-size: 25px;
      font-weight: 700;
      letter-spacing: 0.06em;
      line-height: 1.12;
      color: var(--ink-main);
    }

    .page-en {
      font-family: "Cormorant Garamond", Georgia, serif;
      font-style: italic;
      font-size: 16px;
      font-weight: 600;
      color: var(--ink-muted);
    }

    /* ================= 2. ワークスペース ================= */
    .sos-workspace {
      position: relative;
      z-index: 2;
      flex: 1 1 auto;
      min-height: 0;
      display: grid;
      grid-template-columns: 312px 1fr;
      gap: 20px;
      padding-top: 2px;
    }

    .symptom-col,
    .detail-col {
      display: flex;
      flex-direction: column;
      gap: 10px;
      min-width: 0;
      min-height: 0;
    }

    .col-lead {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 0 2px;
      flex-shrink: 0;
    }

    .col-step-num {
      width: 24px;
      height: 24px;
      border-radius: 50%;
      background: var(--axis);
      color: #fffdf8;
      font-family: var(--font-ui);
      font-size: 13px;
      font-weight: 700;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }

    .col-lead-title {
      font-family: var(--font-serif);
      font-size: 17.5px;
      font-weight: 700;
      letter-spacing: 0.04em;
      color: var(--ink-main);
      line-height: 1.2;
    }

    /* ================= 3. 左カラム：補足なしのすっきりリスト ================= */
    .symptom-list {
      flex: 1 1 auto;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      gap: 9px;
      min-height: 0;
    }

    .symptom-btn {
      flex: 1 1 0;
      width: 100%;
      background: rgba(255, 253, 248, 0.78);
      border: 1px solid var(--line-soft);
      border-bottom: 2px solid var(--line-strong);
      border-radius: 12px;
      padding: 8px 14px 8px 13px;
      display: flex;
      align-items: center;
      gap: 12px;
      text-align: left;
      cursor: pointer;
      transition: background-color 0.14s ease, border-color 0.14s ease, transform 0.08s ease;
    }

    .symptom-btn:hover:not(.is-active) {
      background: var(--card-paper);
      border-color: #b49f83;
    }

    .symptom-btn:active { transform: translateY(1px); }

    .symptom-btn.is-active {
      background: var(--axis-fill);
      border: 1.6px solid var(--axis);
      border-left: 5px solid var(--sos-color);
      border-bottom: 2.6px solid var(--axis-dark);
      box-shadow: 0 3px 10px rgba(59, 45, 35, 0.1);
    }

    .sym-icon-wrap {
      width: 42px;
      height: 42px;
      border-radius: 50%;
      background: var(--surface-muted);
      border: 1px solid var(--line-soft);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }

    .symptom-btn.is-active .sym-icon-wrap {
      background: var(--card-paper);
      border-color: var(--sos-bd);
    }

    .sym-icon-wrap svg {
      width: 26px;
      height: 26px;
    }

    .sym-btn-title {
      flex: 1;
      min-width: 0;
      font-family: var(--font-serif);
      font-size: 17.5px;
      font-weight: 700;
      letter-spacing: 0.02em;
      color: var(--ink-main);
      line-height: 1.25;
      white-space: nowrap;
    }

    .sym-btn-arrow {
      font-size: 18px;
      font-weight: 700;
      line-height: 1;
      color: rgba(117, 100, 85, 0.5);
      flex-shrink: 0;
    }

    .symptom-btn.is-active .sym-btn-arrow {
      color: var(--sos-color);
    }

    /* ================= 4. 右カラム：縦スクロール対応の一本道紙面 ================= */
    .detail-card {
      flex: 1 1 auto;
      background: var(--card-paper);
      border: 1px solid var(--line-soft);
      border-bottom: 2px solid var(--line-strong);
      border-radius: 16px;
      padding: 20px 0 0;
      box-shadow: var(--shadow-soft);
      display: flex;
      flex-direction: column;
      min-height: 0;
      overflow: hidden;
    }

    .detail-head {
      display: flex;
      align-items: center;
      gap: 14px;
      margin: 0 28px;
      padding-bottom: 13px;
      border-bottom: 1px solid var(--line-hair);
      flex-shrink: 0;
    }

    .detail-icon-big {
      width: 48px;
      height: 48px;
      border-radius: 50%;
      background: var(--surface-muted);
      border: 1px solid var(--line-soft);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }

    .detail-icon-big svg { width: 29px; height: 29px; }

    .detail-title {
      font-family: var(--font-serif);
      font-size: 25px;
      font-weight: 700;
      letter-spacing: 0.04em;
      color: var(--ink-main);
      line-height: 1.2;
    }

    .detail-scroll {
      flex: 1 1 auto;
      min-height: 0;
      overflow-y: auto;
      overflow-x: hidden;
      padding: 18px 28px 26px;
      display: flex;
      flex-direction: column;
      gap: 20px;
      -webkit-overflow-scrolling: touch;
      touch-action: pan-y;
      scrollbar-color: #c2ae8e transparent;
      scrollbar-width: thin;
    }

    .detail-scroll::-webkit-scrollbar { width: 6px; }
    .detail-scroll::-webkit-scrollbar-thumb { background: #cbbba6; border-radius: 6px; }

    /* 1問チェック：大きい質問 → 聞く理由（1行） → 2択ボタン */
    .check-box {
      padding-bottom: 18px;
      border-bottom: 1px solid var(--line-hair);
      display: flex;
      flex-direction: column;
      gap: 6px;
      flex-shrink: 0;
    }

    .check-box.is-hidden { display: none; }
    .check-box.is-unanswered { border-bottom: none; padding-bottom: 0; }

    .check-q-text {
      font-family: var(--font-serif);
      font-size: 21px;
      font-weight: 700;
      letter-spacing: 0.02em;
      color: var(--ink-main);
      line-height: 1.38;
    }

    .check-reason {
      font-family: var(--font-ui);
      font-size: 14px;
      font-weight: 500;
      color: var(--ink-muted);
      line-height: 1.45;
      margin-bottom: 8px;
    }

    .check-btn-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }

    .check-choice-btn {
      min-height: 50px;
      padding: 10px 14px;
      border-radius: 10px;
      background: var(--surface-muted);
      border: 1.2px solid var(--line-strong);
      border-bottom: 2.4px solid #b39f86;
      font-size: 15.5px;
      font-weight: 700;
      color: var(--ink-main);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      line-height: 1.25;
      transition: transform 0.08s ease, background-color 0.14s ease, border-color 0.14s ease, color 0.14s ease;
    }

    .check-choice-btn:hover:not(.is-selected) {
      background: #f2eadc;
      border-color: var(--axis);
    }

    .check-choice-btn:active { transform: translateY(1px); }

    .check-choice-btn.is-selected {
      background: var(--check-color);
      border: 1.6px solid var(--check-deep);
      border-bottom: 2.6px solid #1b384a;
      color: #fffdf8;
      box-shadow: 0 2px 8px rgba(41, 78, 99, 0.18);
    }

    /* 診断結果エリア：縦一本道（結論 → 行動リスト → これはNG） */
    .result-body {
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    .result-body.is-hidden { display: none; }

    /* 結論：上の質問と同じ書き方（大きい明朝見出し＋1行補足） */
    .cause-box {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .cause-title {
      font-family: var(--font-serif);
      font-size: 21px;
      font-weight: 700;
      letter-spacing: 0.02em;
      color: var(--ink-main);
      line-height: 1.38;
    }

    .cause-box.is-urgent .cause-title { color: var(--sos-deep); }
    .cause-box.is-safe .cause-title { color: var(--ok-deep); }

    .cause-desc {
      font-family: var(--font-ui);
      font-size: 14px;
      font-weight: 500;
      color: var(--ink-muted);
      line-height: 1.5;
    }

    /* 行動リスト（見出しなし・全幅でゆったり） */
    .do-list {
      list-style: none;
      display: flex;
      flex-direction: column;
      gap: 18px;
      padding: 2px 0 4px;
    }

    .do-item {
      display: flex;
      align-items: flex-start;
      gap: 13px;
    }

    .do-num {
      width: 28px;
      height: 28px;
      border-radius: 50%;
      background: var(--ok-color);
      color: #fffdf8;
      font-size: 14px;
      font-weight: 700;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      margin-top: 1px;
    }

    .do-text {
      display: flex;
      flex-direction: column;
      gap: 5px;
      min-width: 0;
    }

    .do-head {
      font-family: var(--font-ui);
      font-size: 18px;
      font-weight: 700;
      color: var(--ink-main);
      line-height: 1.35;
      letter-spacing: 0.01em;
    }

    .do-sub {
      font-family: var(--font-ui);
      font-size: 14px;
      font-weight: 500;
      color: var(--ink-sub);
      line-height: 1.6;
    }

    /* これはNG：下に配置し、初期表示で上端が見切れてスクロールに気づく設計 */
    .ng-card {
      margin-top: 4px;
      background: var(--sos-tint);
      border: 1px solid var(--sos-bd);
      border-top: 3px solid var(--sos-color);
      border-radius: 12px;
      padding: 15px 18px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .ng-label {
      align-self: flex-start;
      font-size: 12.8px;
      font-weight: 700;
      letter-spacing: 0.08em;
      color: var(--sos-deep);
      padding-bottom: 3px;
      border-bottom: 2px solid var(--sos-color);
    }

    .ng-main {
      font-family: var(--font-ui);
      font-size: 17.5px;
      font-weight: 700;
      color: var(--sos-deep);
      line-height: 1.4;
      margin-top: 2px;
    }

    .ng-desc {
      font-size: 14px;
      font-weight: 500;
      color: #5c362e;
      line-height: 1.6;
    }

    /* ================= 5. 下部関連リンク ================= */
    .related-bar {
      flex: 0 0 46px;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }

    .related-btn {
      display: inline-flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      padding: 0 14px 0 13px;
      border-radius: 11px;
      background: var(--card-paper);
      border: 1px solid var(--line-soft);
      border-bottom: 2px solid var(--line-strong);
      font-size: 14.5px;
      font-weight: 700;
      color: var(--ink-main);
      cursor: pointer;
      box-shadow: var(--shadow-soft);
      transition: transform 0.08s ease, background-color 0.12s ease, border-color 0.12s ease;
    }

    .related-btn:hover { background: #fdf9f0; border-color: #b49f83; }
    .related-btn:active { transform: translateY(1px); background: var(--axis-fill); }

    .related-btn.is-primary {
      background: var(--axis-soft);
      border: 1.2px solid #cbbba6;
      border-bottom: 2.2px solid #b39f86;
    }

    .related-btn.is-primary:hover { background: var(--axis-fill); }

    .rel-left {
      display: flex;
      align-items: center;
      gap: 9px;
      min-width: 0;
      white-space: nowrap;
    }

    .rel-tag {
      padding: 2px 8px;
      border-radius: 4px;
      background: rgba(94, 71, 54, 0.08);
      color: var(--ink-sub);
      font-size: 11.8px;
      font-weight: 700;
      white-space: nowrap;
    }

    .related-btn.is-primary .rel-tag {
      background: rgba(255, 253, 248, 0.88);
      color: var(--axis-dark);
    }

    .rel-arrow {
      font-size: 18px;
      font-weight: 700;
      color: var(--axis);
      line-height: 1;
      flex-shrink: 0;
    }
  </style>
</head>
<body>
  <div class="viewport-wrapper">
    <main class="canvas" id="appCanvas">

      <header class="page-header">
        <div class="header-left">
          <div class="header-nav-group">
            <button class="back-btn" type="button" id="backBtn" data-nav-role="back">
              <span class="back-arrow" aria-hidden="true">‹</span>
              <span>もどる</span>
            </button>
            <button class="home-btn" type="button" id="topHomeBtn" data-nav-role="home">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <path d="M3 10.5 12 3l9 7.5" />
                <path d="M5.5 9.5V20h13V9.5" />
              </svg>
              <span>表紙</span>
            </button>
          </div>
          <div class="title-wrap">
            <h1 class="page-title">困ったときのSOS</h1>
            <span class="page-en">Trouble SOS</span>
          </div>
        </div>
      </header>

      <div class="sos-workspace">
        <section class="symptom-col" aria-label="症状をえらぶ">
          <div class="col-lead">
            <span class="col-step-num" aria-hidden="true">1</span>
            <h2 class="col-lead-title">いま、どんな様子？</h2>
          </div>
          <div class="symptom-list" id="symptomList"></div>
        </section>

        <section class="detail-col" aria-label="原因と対処法">
          <div class="col-lead">
            <span class="col-step-num" aria-hidden="true">2</span>
            <h2 class="col-lead-title">原因と、今すぐできる対処</h2>
          </div>

          <article class="detail-card" id="detailCard">
            <div class="detail-head">
              <div class="detail-icon-big" id="detailIcon" aria-hidden="true"></div>
              <h3 class="detail-title" id="detailTitle"></h3>
            </div>

            <div class="detail-scroll" id="detailScroll">
              <div class="check-box is-hidden" id="checkBox">
                <p class="check-q-text" id="checkQuestion"></p>
                <p class="check-reason" id="checkReason"></p>
                <div class="check-btn-row" id="checkChoices"></div>
              </div>

              <div class="result-body" id="resultBody">
                <div class="cause-box" id="causeBox">
                  <p class="cause-title" id="causeTitle"></p>
                  <p class="cause-desc" id="causeDesc"></p>
                </div>

                <ol class="do-list" id="doList"></ol>

                <div class="ng-card">
                  <span class="ng-label">これはNG</span>
                  <p class="ng-main" id="ngMain"></p>
                  <p class="ng-desc" id="ngDesc"></p>
                </div>
              </div>
            </div>
          </article>

          <div class="related-bar" id="relatedBar"></div>
        </section>
      </div>

    </main>
  </div>

  <script>
    const ICONS = {
      wrinkle: `<svg viewBox="0 0 40 40" fill="none">
        <path d="M20 34 C12 31 7 23 9 14 C14 15 18 20 20 26 C22 20 26 15 31 14 C33 23 28 31 20 34 Z" fill="#c7d4ad" stroke="#5b7a46" stroke-width="1.8" stroke-linejoin="round"/>

    function renderSymptomList() {
      symptomListEl.innerHTML = SYMPTOMS.map((s) => `
        <button class="symptom-btn ${s.id === currentSymId ? "is-active" : ""}" type="button" data-sym="${s.id}">

    function renderDetail() {
      const s = SYMPTOMS.find((x) => x.id === currentSymId) || SYMPTOMS[0];
      detailIconEl.innerHTML = s.icon;
      detailTitleEl.textContent = s.title;
      detailScrollEl.scrollTop = 0;

      checkBoxEl.classList.toggle("is-hidden", !s.check);
      if (s.check) {
        checkQuestionEl.textContent = s.check.question;
        checkReasonEl.textContent = s.check.reason;
        checkChoicesEl.innerHTML = s.check.choices.map((c) => `
          <button class="check-choice-btn" type="button" data-choice="${c.id}">
            <span>${c.label}</span>
          </button>
        `).join("");
      }

      relatedBarEl.innerHTML = s.related.map((r) => `
        <button class="related-btn ${r.primary ? "is-primary" : ""}" type="button" data-nav-url="${r.nav}">
          <span class="rel-left">
            <span class="rel-tag">${r.tag}</span>
            <span>${r.label}</span>
          </span>
          <span class="rel-arrow" aria-hidden="true">›</span>
        </button>
      `).join("");
      renderResponse(s);
    }

    function renderResponse(s) {
      let activeData = s;
      if (s.check) {
        const selectedId = choiceState[s.id];
        for (const button of checkChoicesEl.children) {
          button.classList.toggle("is-selected", button.dataset.choice === selectedId);
        }
        activeData = s.check.choices.find((choice) => choice.id === selectedId);
        checkBoxEl.classList.toggle("is-unanswered", !activeData);
      }
      resultBodyEl.classList.toggle("is-hidden", !activeData);
      if (!activeData) return;

      causeBoxEl.classList.remove("is-urgent", "is-safe");
      if (activeData.tone === "urgent") causeBoxEl.classList.add("is-urgent");
      if (activeData.tone === "safe") causeBoxEl.classList.add("is-safe");

      causeTitleEl.textContent = activeData.causeTitle;
      causeDescEl.textContent = activeData.causeDesc || "";
      causeDescEl.style.display = activeData.causeDesc ? "" : "none";

      doListEl.innerHTML = activeData.dos.map((d, idx) => `
        <li class="do-item">
          <span class="do-num" aria-hidden="true">${idx + 1}</span>
          <div class="do-text">
            <p class="do-head">${d.head}</p>
            ${d.sub ? `<p class="do-sub">${d.sub}</p>` : ""}

      ngMainEl.textContent = activeData.ngMain;

        button.classList.toggle("is-active", button.dataset.sym === id);
      }
      renderDetail();
    }

    function selectChoice(choiceId) {
      if (!choiceId || choiceState[currentSymId] === choiceId) return;
      choiceState[currentSymId] = choiceId;
      renderResponse(SYMPTOMS.find((s) => s.id === currentSymId));

    const pageParams = new URLSearchParams(window.location.search);
    const fromPage = pageParams.get("from") || "";
    const ALLOWED_BASICS_PAGES = new Set([
      "basics_wind",
      "basics_light",
      "basics_water",
      "basics_soil",
      "basics_fertilizer"
    ]);

    function buildHomeUrl() {
      const qMonth = pageParams.get("month");
      return qMonth ? `index.html?month=${encodeURIComponent(qMonth)}` : "index.html";
    }

    function buildSimUrl(addFromSos = false) {
      const next = new URLSearchParams();
      if (addFromSos) {
        next.set("from", "sos");
        next.set("sym", currentSymId);
        if (choiceState[currentSymId]) next.set("choice", choiceState[currentSymId]);
        if (fromPage) next.set("sosFrom", fromPage);
      }
      ["type", "season", "light", "wind", "water", "month"].forEach((k) => {
        const v = pageParams.get(k);
        if (v) next.set(k, v);
      });
      const qs = next.toString();
      return qs ? `sim.html?${qs}` : "sim.html";
    }

    function buildBackUrl() {
      const qMonth = pageParams.get("month");
      if (fromPage === "sim") return buildSimUrl(false);
      if (fromPage === "basics") {
        return qMonth ? `basics.html?month=${encodeURIComponent(qMonth)}` : "basics.html";
      }
      if (ALLOWED_BASICS_PAGES.has(fromPage)) {
        return qMonth ? `${fromPage}.html?month=${encodeURIComponent(qMonth)}` : `${fromPage}.html`;
      }
      return buildHomeUrl();
    }

    function navigateWithParams(baseUrl) {
      if (!baseUrl) return;
      if (baseUrl === "sim.html") {
        window.location.href = buildSimUrl(true);
        return;
      }
      const next = new URLSearchParams();
      next.set("from", "sos");
      next.set("sym", currentSymId);
      if (choiceState[currentSymId]) next.set("choice", choiceState[currentSymId]);
      if (fromPage) next.set("sosFrom", fromPage);
      ["type", "season", "light", "wind", "water", "month"].forEach((k) => {
        const v = pageParams.get(k);
        if (v) next.set(k, v);
      });
      window.location.href = `${baseUrl}?${next.toString()}`;
    }

    function handleNavRole(role) {
      if (role === "back") window.location.href = buildBackUrl();
      else if (role === "home") window.location.href = buildHomeUrl();
    }

    let lastTapTs = 0;

    function handleInteractiveTarget(target) {
      if (!target) return false;
      const symBtn = target.closest("[data-sym]");
      if (symBtn) { selectSymptom(symBtn.dataset.sym); return true; }
      const choiceBtn = target.closest("[data-choice]");
      if (choiceBtn) { selectChoice(choiceBtn.dataset.choice); return true; }
      const navRoleBtn = target.closest("[data-nav-role]");
      if (navRoleBtn) { handleNavRole(navRoleBtn.dataset.navRole); return true; }
      const navUrlBtn = target.closest("[data-nav-url]");
      if (navUrlBtn) { navigateWithParams(navUrlBtn.dataset.navUrl); return true; }
      return false;
    }

    document.addEventListener("pointerdown", (e) => {
      if (e.pointerType === "mouse" && e.button !== 0) return;
      const now = Date.now();
      if (now - lastTapTs < 200) return;

      if (e.target && e.target.closest && handleInteractiveTarget(e.target)) {
        lastTapTs = now;
        e.preventDefault();
        return;
      }

      const x = e.clientX;
      const y = e.clientY;
      const allBtns = document.querySelectorAll("[data-sym], [data-choice], [data-nav-role], [data-nav-url]");
      for (const btn of allBtns) {
        const rect = btn.getBoundingClientRect();
        if (rect.width === 0 || rect.height === 0) continue;
        if (x >= rect.left && x <= rect.right && y >= rect.top && y <= rect.bottom) {
          lastTapTs = now;
          e.preventDefault();
          handleInteractiveTarget(btn);
          return;
        }
      }
    }, { capture: true, passive: false });

    document.addEventListener("click", (e) => {
      if (Date.now() - lastTapTs < 350) return;
      if (e.target && e.target.closest) handleInteractiveTarget(e.target);
    });

    const AUTO_RETURN_MS = 300000;
    if (AUTO_RETURN_MS) {
      let idleTimer = null;
      function resetIdleTimer() {
        clearTimeout(idleTimer);
        idleTimer = setTimeout(() => { window.location.href = "index.html"; }, AUTO_RETURN_MS);
      }
      ["pointerdown", "touchstart", "click", "keydown", "scroll"].forEach((ev) => {
        window.addEventListener(ev, resetIdleTimer, { passive: true });
      });
      resetIdleTimer();
    }

    function fitCanvas() {
      const canvas = document.getElementById("appCanvas");
      const scale = Math.min(window.innerWidth / 1080, window.innerHeight / 786);
      if (window.CSS && CSS.supports && CSS.supports("zoom", "1")) {
        canvas.style.zoom = scale;
        canvas.style.transform = "none";
      } else {
        canvas.style.zoom = "";
        canvas.style.transform = `scale(${scale})`;
      }
    }

    window.addEventListener("resize", fitCanvas);
    window.addEventListener("orientationchange", fitCanvas);

    const initSym = pageParams.get("sym");
    if (initSym && SYMPTOMS.some((s) => s.id === initSym)) {
      currentSymId = initSym;
    }
    const initChoice = pageParams.get("choice");
    const initSymObj = SYMPTOMS.find((s) => s.id === currentSymId);
    if (initChoice && initSymObj && initSymObj.check && initSymObj.check.choices.some((c) => c.id === initChoice)) {
      choiceState[currentSymId] = initChoice;
    }
    renderSymptomList();
    renderDetail();
    fitCanvas();
  </script>
</body>
</html>
