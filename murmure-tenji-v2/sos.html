<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />

  <!-- =========================================================================
    保木平珈琲 Murmure｜展示用iPad Webアプリ「困ったときのSOS」（v2・表現＆導線改善版）
    - basics.html / sim.html / index.html と完全統一した「温かいクリーム紙 × こげ茶インク × 明朝見出し × 淡面＋枠線」
    - ヘッダー寸法（上14px・左右24px・ボタン高さ40px・明朝25px・下線1px）を全ページ完全一致
    - シワシワ（乾いている側）の断定をやわらげ、根の確認を追記／害虫予防を新株チェックへ更新
    - 関連ガイドを5つの基本ページ（basics_water / basics_light / basics_wind / basics_soil）へ直リンク化
    - 5つの基本ページ（basics_*）からの「もどる」復帰に対応
  ========================================================================= -->

  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="多肉の育て方" />
  <meta name="theme-color" content="#f6f0e4" />
  <meta name="format-detection" content="telephone=no" />
  <link rel="manifest" href="manifest.json" />
  <link rel="apple-touch-icon" sizes="180x180" href="images/apple-touch-icon.png" />
  <link rel="icon" type="image/png" sizes="512x512" href="images/icon-512.png" />

  <title>Murmure｜困ったときのSOS</title>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500;1,600&family=Shippori+Mincho:wght@500;600;700&family=Zen+Maru+Gothic:wght@400;500;700&display=swap" rel="stylesheet" />

  <style>
    :root {
      --bg-outer: #e9dfd0;
      --bg-paper: #f6f0e4;
      --card-paper: #fffdf8;
      --surface-muted: #faf6ed;
      --ink-main: #2d1f16;
      --ink-sub: #4e3d30;
      --ink-muted: #6e5c4d;
      --line-soft: #d7c7ad;
      --line-strong: #c2ae8e;
      --line-hair: rgba(180, 162, 134, 0.42);

      --axis: #5e4736;
      --axis-dark: #453326;
      --axis-soft: #f2eadc;
      --axis-fill: #ebe0cc;
      --rail-color: #78604e;

      --sos-color: #a6432e;
      --sos-deep: #7d2c1b;
      --sos-tint: #fdf4f2;
      --sos-soft: rgba(166, 67, 46, 0.11);
      --sos-bd: rgba(166, 67, 46, 0.34);

      --ok-color: #4d6b38;
      --ok-deep: #344d23;
      --ok-tint: #f4f8f1;
      --ok-soft: rgba(77, 107, 56, 0.12);
      --ok-bd: rgba(77, 107, 56, 0.34);

      --check-color: #3f6f8a;
      --check-deep: #294e63;
      --check-tint: #f1f6f9;
      --check-soft: rgba(63, 111, 138, 0.11);
      --check-bd: rgba(63, 111, 138, 0.34);

      --amber-color: #9e5612;
      --amber-deep: #783f0a;
      --amber-tint: #fbf6ee;
      --amber-soft: rgba(158, 86, 18, 0.12);
      --amber-bd: rgba(158, 86, 18, 0.34);

      --shadow-soft: 0 2px 10px rgba(72, 54, 38, 0.055);
      --font-serif: "Shippori Mincho", "Hiragino Mincho ProN", "Yu Mincho", serif;
      --font-ui: "Zen Maru Gothic", "Hiragino Maru Gothic ProN", sans-serif;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
      -webkit-user-select: none;
      user-select: none;
      -webkit-touch-callout: none;
    }

    button, a {
      font: inherit;
      color: inherit;
      text-decoration: none;
      touch-action: manipulation;
    }

    button:focus-visible, a:focus-visible {
      outline: 3px solid #ab542c;
      outline-offset: -3px;
    }

    svg {
      display: block;
      flex-shrink: 0;
    }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: var(--bg-outer);
      font-family: var(--font-ui);
      color: var(--ink-main);
    }

    .viewport-wrapper {
      position: fixed;
      inset: 0;
      width: 100vw;
      height: 100vh;
      height: 100dvh;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .canvas {
      position: relative;
      width: 1080px;
      height: 786px;
      min-width: 1080px;
      min-height: 786px;
      background: linear-gradient(135deg, #f9f5e9, #f2ead9);
      transform-origin: center center;
      padding: 14px 24px 16px;
      display: flex;
      flex-direction: column;
      gap: 12px;
      box-shadow: 0 12px 36px rgba(59, 45, 35, 0.14);
      overflow: hidden;
    }

    .canvas::before {
      content: "";
      position: absolute;
      inset: 0;
      pointer-events: none;
      background-image: radial-gradient(rgba(110, 88, 66, 0.045) 1px, transparent 0);
      background-size: 16px 16px;
      opacity: 0.7;
    }

    .page-header {
      position: relative;
      z-index: 2;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 14px;
      flex-shrink: 0;
      border-bottom: 1px solid var(--line-soft);
      padding-bottom: 8px;
    }

    .header-left {
      display: flex;
      align-items: center;
      gap: 16px;
    }

    .header-nav-group {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      flex-shrink: 0;
    }

    .back-btn,
    .home-btn {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      height: 40px;
      padding: 0 15px;
      background: var(--card-paper);
      border: 1px solid var(--line-soft);
      border-bottom: 2px solid var(--line-strong);
      border-radius: 10px;
      font-family: var(--font-ui);
      font-size: 14.5px;
      font-weight: 700;
      color: var(--ink-main);
      cursor: pointer;
      flex-shrink: 0;
      transition: background-color 0.12s ease, transform 0.08s ease;
    }

    .home-btn {
      background: var(--axis-soft);
      border-color: #cbbba6;
      border-bottom-color: #b39f86;
      color: var(--axis);
    }

    .back-btn:active,
    .home-btn:active {
      transform: translateY(1px);
      background: #ebe4d5;
    }

    .back-arrow {
      font-size: 19px;
      line-height: 1;
      color: var(--axis);
    }

    .home-btn svg {
      width: 15px;
      height: 15px;
      color: var(--axis);
    }

    .title-wrap {
      display: flex;
      align-items: baseline;
      gap: 12px;
    }

    .page-title {
      font-family: var(--font-serif);
      font-size: 25px;
      font-weight: 700;
      letter-spacing: 0.06em;
      line-height: 1.12;
      color: var(--ink-main);
    }

    .page-en {
      font-family: "Cormorant Garamond", Georgia, serif;
      font-style: italic;
      font-size: 16px;
      font-weight: 600;
      color: var(--ink-muted);
    }

    .sos-workspace {
      position: relative;
      z-index: 2;
      flex: 1 1 auto;
      min-height: 0;
      display: grid;
      grid-template-columns: 342px 1fr;
      gap: 18px;
      padding-top: 4px;
    }

    .symptom-col,
    .detail-col {
      display: flex;
      flex-direction: column;
      gap: 10px;
      min-width: 0;
      min-height: 0;
    }

    .col-lead {
      display: flex;
      align-items: center;
      gap: 9px;
      padding: 0 2px;
      flex-shrink: 0;
    }

    .col-step-num {
      width: 26px;
      height: 26px;
      border-radius: 50%;
      background: var(--rail-color);
      border: 2px solid var(--bg-paper);
      color: #ffffff;
      font-family: var(--font-ui);
      font-size: 13.5px;
      font-weight: 700;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }

    .col-lead-title {
      font-family: var(--font-serif);
      font-size: 18.5px;
      font-weight: 700;
      letter-spacing: 0.04em;
      color: var(--ink-main);
      line-height: 1.25;
    }

    .symptom-list {
      flex: 1 1 auto;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      gap: 9px;
      min-height: 0;
    }

    .symptom-btn {
      flex: 1 1 0;
      width: 100%;
      background: rgba(255, 253, 248, 0.94);
      border: 1.2px solid var(--line-soft);
      border-bottom: 2px solid var(--line-strong);
      border-radius: 13px;
      padding: 8px 13px 8px 12px;
      display: flex;
      align-items: center;
      gap: 12px;
      text-align: left;
      cursor: pointer;
      box-shadow: var(--shadow-soft);
      transition: transform 0.08s ease, background-color 0.14s ease, border-color 0.14s ease;
      position: relative;
    }

    .symptom-btn:hover:not(.is-active) {
      background: #fffdf8;
      border-color: #b49f83;
    }

    .symptom-btn:active { transform: translateY(1px); }

    .symptom-btn.is-active {
      background: var(--axis-fill);
      border: 1.8px solid var(--axis);
      border-left: 5px solid var(--sos-color);
      border-bottom: 2.8px solid var(--axis-dark);
      box-shadow: 0 3px 10px rgba(59, 45, 35, 0.11);
    }

    .sym-icon-wrap {
      width: 44px;
      height: 44px;
      border-radius: 50%;
      background: var(--surface-muted);
      border: 1.2px solid var(--line-soft);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }

    .symptom-btn.is-active .sym-icon-wrap {
      background: var(--card-paper);
      border-color: rgba(166, 67, 46, 0.34);
    }

    .sym-icon-wrap svg {
      width: 28px;
      height: 28px;
    }

    .sym-btn-text {
      display: flex;
      flex-direction: column;
      gap: 3px;
      min-width: 0;
      flex: 1;
    }

    .sym-btn-title {
      font-family: var(--font-serif);
      font-size: 16.8px;
      font-weight: 700;
      letter-spacing: 0.02em;
      color: var(--ink-main);
      line-height: 1.22;
      white-space: nowrap;
    }

    .sym-btn-sub {
      font-family: var(--font-ui);
      font-size: 12px;
      font-weight: 500;
      color: var(--ink-muted);
      line-height: 1.2;
      white-space: nowrap;
    }

    .symptom-btn.is-active .sym-btn-sub { color: var(--ink-sub); }

    .sym-btn-arrow {
      width: 22px;
      height: 22px;
      border-radius: 50%;
      background: var(--axis-soft);
      border: 1px solid rgba(94, 71, 54, 0.25);
      color: var(--ink-muted);
      font-family: var(--font-ui);
      font-size: 15px;
      font-weight: 700;
      line-height: 1;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding-left: 1.5px;
      padding-bottom: 1px;
      flex-shrink: 0;
    }

    .symptom-btn.is-active .sym-btn-arrow {
      background: var(--card-paper);
      border-color: var(--sos-bd);
      color: var(--sos-color);
    }

    .detail-card {
      flex: 1 1 auto;
      background: rgba(255, 253, 248, 0.96);
      border: 1.2px solid var(--line-soft);
      border-bottom: 2.5px solid var(--line-strong);
      border-radius: 16px;
      padding: 18px 22px 18px;
      box-shadow: var(--shadow-soft);
      display: flex;
      flex-direction: column;
      gap: 14px;
      min-height: 0;
      overflow: hidden;
    }

    .detail-head {
      display: flex;
      align-items: center;
      gap: 14px;
      padding-bottom: 12px;
      border-bottom: 1px dashed var(--line-hair);
      flex-shrink: 0;
    }

    .detail-icon-big {
      width: 54px;
      height: 54px;
      border-radius: 50%;
      background: var(--sos-tint);
      border: 1.5px solid var(--sos-bd);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }

    .detail-icon-big svg { width: 34px; height: 34px; }

    .detail-title-group {
      display: flex;
      flex-direction: column;
      gap: 4px;
      min-width: 0;
    }

    .detail-title {
      font-family: var(--font-serif);
      font-size: 24px;
      font-weight: 700;
      letter-spacing: 0.04em;
      color: var(--ink-main);
      line-height: 1.2;
    }

    .detail-term {
      font-family: var(--font-ui);
      font-size: 13px;
      font-weight: 500;
      color: var(--ink-muted);
      line-height: 1.2;
    }

    .check-box {
      background: var(--check-tint);
      border: 1.2px solid var(--check-bd);
      border-radius: 12px;
      padding: 12px 15px;
      display: flex;
      flex-direction: column;
      gap: 10px;
      flex-shrink: 0;
    }

    .check-box.is-hidden { display: none; }

    .check-q-row {
      display: flex;
      align-items: center;
      gap: 9px;
    }

    .check-q-badge {
      display: inline-flex;
      align-items: center;
      padding: 2.5px 10px;
      border-radius: 999px;
      background: var(--card-paper);
      border: 1.2px solid var(--check-bd);
      color: var(--check-deep);
      font-family: var(--font-ui);
      font-size: 11.8px;
      font-weight: 700;
      white-space: nowrap;
      flex-shrink: 0;
    }

    .check-q-text {
      font-family: var(--font-ui);
      font-size: 15.2px;
      font-weight: 700;
      color: var(--check-deep);
      line-height: 1.3;
    }

    .check-btn-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }

    .check-choice-btn {
      min-height: 46px;
      padding: 8px 12px;
      border-radius: 10px;
      background: var(--card-paper);
      border: 1.2px solid rgba(63, 111, 138, 0.36);
      border-bottom: 2.2px solid rgba(63, 111, 138, 0.5);
      font-family: var(--font-ui);
      font-size: 14.8px;
      font-weight: 700;
      color: var(--check-deep);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      line-height: 1.25;
      transition: transform 0.08s ease, background-color 0.14s ease, border-color 0.14s ease;
    }

    .check-choice-btn:hover:not(.is-selected) {
      background: #f8fbfd;
      border-color: var(--check-color);
    }

    .check-choice-btn:active { transform: translateY(1px); }

    .check-choice-btn.is-selected {
      background: var(--check-color);
      border: 1.8px solid var(--check-deep);
      border-bottom: 2.8px solid #1b384a;
      color: #fffdf8;
      box-shadow: 0 2px 8px rgba(41, 78, 99, 0.18);
    }

    /* 未選択時：まず確かめることパネル（上詰めで1問チェックから視線を近く） */
    .precheck-panel {
      flex: 1 1 auto;
      background: var(--surface-muted);
      border: 1.4px dashed var(--line-strong);
      border-radius: 13px;
      padding: 18px 22px;
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      justify-content: flex-start;
      gap: 11px;
    }

    .precheck-panel.is-hidden { display: none; }

    .precheck-pill {
      display: inline-flex;
      align-items: center;
      padding: 3.5px 12px;
      border-radius: 999px;
      background: var(--amber-soft);
      border: 1px solid var(--amber-bd);
      color: var(--amber-deep);
      font-family: var(--font-ui);
      font-size: 12.6px;
      font-weight: 700;
      letter-spacing: 0.04em;
    }

    .precheck-lead {
      font-family: var(--font-serif);
      font-size: 21px;
      font-weight: 700;
      letter-spacing: 0.02em;
      color: var(--ink-main);
      line-height: 1.5;
    }

    .precheck-sub {
      font-family: var(--font-ui);
      font-size: 14.5px;
      font-weight: 500;
      color: var(--ink-sub);
      line-height: 1.6;
    }

    .precheck-tap-hint {
      margin-top: 4px;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 5.5px 13px;
      border-radius: 999px;
      background: var(--check-soft);
      border: 1px solid var(--check-bd);
      color: var(--check-deep);
      font-family: var(--font-ui);
      font-size: 13.2px;
      font-weight: 700;
    }

    .result-body {
      flex: 1 1 auto;
      min-height: 0;
      display: flex;
      flex-direction: column;
      gap: 13px;
    }

    .result-body.is-hidden { display: none; }

    .cause-box {
      --c-accent: var(--amber-color);
      --c-deep: var(--amber-deep);
      --c-tint: var(--amber-tint);
      --c-bd: var(--amber-bd);
      background: var(--c-tint);
      border: 1.2px solid var(--c-bd);
      border-left: 5px solid var(--c-accent);
      border-radius: 12px;
      padding: 11px 16px;
      display: flex;
      flex-direction: column;
      gap: 4px;
      flex-shrink: 0;
    }

    .cause-box.is-urgent {
      --c-accent: var(--sos-color);
      --c-deep: var(--sos-deep);
      --c-tint: var(--sos-tint);
      --c-bd: var(--sos-bd);
    }

    .cause-box.is-safe {
      --c-accent: var(--ok-color);
      --c-deep: var(--ok-deep);
      --c-tint: var(--ok-tint);
      --c-bd: var(--ok-bd);
    }

    .cause-label {
      font-family: var(--font-ui);
      font-size: 12px;
      font-weight: 700;
      color: var(--c-deep);
      letter-spacing: 0.04em;
    }

    .cause-title {
      font-family: var(--font-serif);
      font-size: 19px;
      font-weight: 700;
      letter-spacing: 0.02em;
      color: var(--ink-main);
      line-height: 1.28;
    }

    .cause-desc {
      font-family: var(--font-ui);
      font-size: 14px;
      font-weight: 500;
      color: var(--ink-sub);
      line-height: 1.5;
    }

    .action-grid {
      flex: 1 1 auto;
      min-height: 0;
      display: grid;
      grid-template-columns: 1.4fr 0.9fr;
      gap: 13px;
      align-items: stretch;
    }

    .do-card {
      background: var(--ok-tint);
      border: 1.2px solid var(--ok-bd);
      border-top: 3.5px solid var(--ok-color);
      border-radius: 13px;
      padding: 14px 16px;
      display: flex;
      flex-direction: column;
      gap: 11px;
    }

    .box-head-pill {
      align-self: flex-start;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 3px 12px;
      border-radius: 999px;
      font-family: var(--font-ui);
      font-size: 12.6px;
      font-weight: 700;
      letter-spacing: 0.04em;
      background: var(--card-paper);
      border: 1.2px solid var(--ok-bd);
      color: var(--ok-deep);
    }

    .do-list {
      list-style: none;
      display: flex;
      flex-direction: column;
      gap: 12px;
      flex: 1;
      justify-content: flex-start;
      padding-top: 2px;
    }

    .do-item {
      display: flex;
      align-items: flex-start;
      gap: 10px;
      font-family: var(--font-ui);
      font-size: 15px;
      font-weight: 500;
      color: var(--ink-main);
      line-height: 1.52;
    }

    .do-item strong {
      font-weight: 700;
      color: var(--ok-deep);
    }

    .do-num {
      width: 24px;
      height: 24px;
      border-radius: 50%;
      background: var(--ok-soft);
      border: 1.3px solid var(--ok-bd);
      color: var(--ok-deep);
      font-size: 13px;
      font-weight: 700;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      margin-top: 1px;
    }

    .ng-card {
      background: var(--sos-tint);
      border: 1.2px solid var(--sos-bd);
      border-top: 3.5px solid var(--sos-color);
      border-radius: 13px;
      padding: 14px 16px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .ng-card .box-head-pill {
      border-color: var(--sos-bd);
      color: var(--sos-deep);
    }

    .ng-main {
      font-family: var(--font-serif);
      font-size: 17px;
      font-weight: 700;
      letter-spacing: 0.02em;
      color: var(--sos-deep);
      line-height: 1.36;
    }

    .ng-desc {
      font-family: var(--font-ui);
      font-size: 14px;
      font-weight: 500;
      color: #543129;
      line-height: 1.52;
      padding-top: 8px;
      border-top: 1px dashed var(--sos-bd);
    }

    .related-bar {
      flex: 0 0 46px;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }

    .related-btn {
      display: inline-flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      padding: 0 14px 0 12px;
      border-radius: 12px;
      background: var(--card-paper);
      border: 1.2px solid var(--line-soft);
      border-bottom: 2.2px solid var(--line-strong);

        dos: [
          "<strong>ほかの鉢から少し離し</strong>、<strong>葉の付け根に白い綿のかたまりがないか</strong>よく見て、綿棒やピンセットでやさしく取り除きます。",
          "くり返し出るときは、<strong>その植物と虫に使えることをラベルで確認</strong>した市販スプレーを使い、風通しを良くしましょう。"
        ],
        ngMain: "ほかの鉢と密着させたまま放置する",
        ngDesc: "気づかないうちに隣の鉢へどんどん広がります。新しく迎えた鉢は、並べる前に葉の付け根を見てみましょう。",
        related: [
          { tag: "風通しのコツ", label: "風通しのきほんを見る", nav: "basics_wind.html", primary: true },
          { tag: "環境の見直し", label: "光・風・水を試す", nav: "sim.html", primary: false }
        ]
      }
    ];

    let currentSymId = SYMPTOMS[0].id;
    const choiceState = { wrinkle: null, jelly: null, drop: null };

    const symptomListEl = document.getElementById("symptomList");
    const detailIconEl = document.getElementById("detailIcon");
    const detailTermEl = document.getElementById("detailTerm");
    const detailTitleEl = document.getElementById("detailTitle");
    const checkBoxEl = document.getElementById("checkBox");
    const checkQuestionEl = document.getElementById("checkQuestion");
    const checkChoicesEl = document.getElementById("checkChoices");
    const precheckPanelEl = document.getElementById("precheckPanel");
    const precheckLeadEl = document.getElementById("precheckLead");
    const precheckSubEl = document.getElementById("precheckSub");
    const resultBodyEl = document.getElementById("resultBody");
    const causeBoxEl = document.getElementById("causeBox");
    const causeLabelEl = document.getElementById("causeLabel");
    const causeTitleEl = document.getElementById("causeTitle");
    const causeDescEl = document.getElementById("causeDesc");
    const doListEl = document.getElementById("doList");
    const ngMainEl = document.getElementById("ngMain");
    const ngDescEl = document.getElementById("ngDesc");
    const relatedBarEl = document.getElementById("relatedBar");

    function renderSymptomList() {
      symptomListEl.innerHTML = SYMPTOMS.map((s) => `
        <button class="symptom-btn ${s.id === currentSymId ? "is-active" : ""}" type="button" data-sym="${s.id}">
          <span class="sym-icon-wrap" aria-hidden="true">${s.icon}</span>
          <span class="sym-btn-text">
            <span class="sym-btn-title">${s.title}</span>
            <span class="sym-btn-sub">${s.sub}</span>
          </span>
          <span class="sym-btn-arrow" aria-hidden="true">›</span>
        </button>
      `).join("");
    }

    function renderDetail() {
      const s = SYMPTOMS.find((x) => x.id === currentSymId) || SYMPTOMS[0];
      detailIconEl.innerHTML = s.icon;
      detailTermEl.textContent = s.term;
      detailTitleEl.textContent = s.title;

      checkBoxEl.classList.toggle("is-hidden", !s.check);
      if (s.check) {
        checkQuestionEl.textContent = s.check.question;
        checkChoicesEl.innerHTML = s.check.choices.map((c) => `
          <button class="check-choice-btn" type="button" data-choice="${c.id}">
            <span>${c.label}</span>
          </button>
        `).join("");
      }

      relatedBarEl.innerHTML = s.related.map((r) => `
        <button class="related-btn ${r.primary ? "is-primary" : ""}" type="button" data-nav-url="${r.nav}">
          <span class="rel-left">
            <span class="rel-tag">${r.tag}</span>
            <span>${r.label}</span>
          </span>
          <span class="rel-arrow" aria-hidden="true">›</span>
        </button>
      `).join("");
      renderResponse(s);
    }

    function renderResponse(s) {
      let activeData = s;
      if (s.check) {
        const selectedId = choiceState[s.id];
        for (const button of checkChoicesEl.children) {
          button.classList.toggle("is-selected", button.dataset.choice === selectedId);
        }
        activeData = s.check.choices.find((choice) => choice.id === selectedId);
      }
      precheckPanelEl.classList.toggle("is-hidden", Boolean(activeData));
      resultBodyEl.classList.toggle("is-hidden", !activeData);
      if (!activeData) {
        precheckLeadEl.textContent = s.check.precheckLead;
        precheckSubEl.textContent = s.check.precheckSub;
        return;
      }

      causeBoxEl.classList.remove("is-urgent", "is-safe");
      if (activeData.tone === "urgent") causeBoxEl.classList.add("is-urgent");
      if (activeData.tone === "safe") causeBoxEl.classList.add("is-safe");

      causeLabelEl.textContent = activeData.causeLabel;
      causeTitleEl.textContent = activeData.causeTitle;
      causeDescEl.textContent = activeData.causeDesc;

      doListEl.innerHTML = activeData.dos.map((d, idx) => `
        <li class="do-item">
          <span class="do-num" aria-hidden="true">${idx + 1}</span>
          <span>${d}</span>
        </li>
      `).join("");

      ngMainEl.textContent = activeData.ngMain;
      ngDescEl.textContent = activeData.ngDesc;
    }

    function selectSymptom(id) {
      if (!id || id === currentSymId) return;
      currentSymId = id;
      for (const button of symptomListEl.children) {
        button.classList.toggle("is-active", button.dataset.sym === id);
      }
      renderDetail();
    }

    function selectChoice(choiceId) {
      if (!choiceId || choiceState[currentSymId] === choiceId) return;
      choiceState[currentSymId] = choiceId;
      renderResponse(SYMPTOMS.find((s) => s.id === currentSymId));
    }

    const pageParams = new URLSearchParams(window.location.search);
    const fromPage = pageParams.get("from") || "";
    const ALLOWED_BASICS_PAGES = new Set([
      "basics_wind",
      "basics_light",
      "basics_water",
      "basics_soil",
      "basics_fertilizer"
    ]);

    function buildHomeUrl() {
      const qMonth = pageParams.get("month");
      return qMonth ? `index.html?month=${encodeURIComponent(qMonth)}` : "index.html";
    }

    function buildSimUrl(addFromSos = false) {
      const next = new URLSearchParams();
      if (addFromSos) {
        next.set("from", "sos");
        next.set("sym", currentSymId);
        if (choiceState[currentSymId]) next.set("choice", choiceState[currentSymId]);
        if (fromPage) next.set("sosFrom", fromPage);
      }
      ["type", "season", "light", "wind", "water", "month"].forEach((k) => {
        const v = pageParams.get(k);
        if (v) next.set(k, v);
      });
      const qs = next.toString();
      return qs ? `sim.html?${qs}` : "sim.html";
    }

    function buildBackUrl() {
      const qMonth = pageParams.get("month");
      if (fromPage === "sim") return buildSimUrl(false);
      if (fromPage === "basics") {
        return qMonth ? `basics.html?month=${encodeURIComponent(qMonth)}` : "basics.html";
      }
      if (ALLOWED_BASICS_PAGES.has(fromPage)) {
        return qMonth ? `${fromPage}.html?month=${encodeURIComponent(qMonth)}` : `${fromPage}.html`;
      }
      return buildHomeUrl();
    }

    function navigateWithParams(baseUrl) {
      if (!baseUrl) return;
      if (baseUrl === "sim.html") {
        window.location.href = buildSimUrl(true);
        return;
      }
      const next = new URLSearchParams();
      next.set("from", "sos");
      next.set("sym", currentSymId);
      if (choiceState[currentSymId]) next.set("choice", choiceState[currentSymId]);
      if (fromPage) next.set("sosFrom", fromPage);
      ["type", "season", "light", "wind", "water", "month"].forEach((k) => {
        const v = pageParams.get(k);
        if (v) next.set(k, v);
      });
      window.location.href = `${baseUrl}?${next.toString()}`;
    }

    function handleNavRole(role) {
      if (role === "back") window.location.href = buildBackUrl();
      else if (role === "home") window.location.href = buildHomeUrl();
    }

    let lastTapTs = 0;

    function handleInteractiveTarget(target) {
      if (!target) return false;
      const symBtn = target.closest("[data-sym]");
      if (symBtn) { selectSymptom(symBtn.dataset.sym); return true; }
      const choiceBtn = target.closest("[data-choice]");
      if (choiceBtn) { selectChoice(choiceBtn.dataset.choice); return true; }
      const navRoleBtn = target.closest("[data-nav-role]");
      if (navRoleBtn) { handleNavRole(navRoleBtn.dataset.navRole); return true; }
      const navUrlBtn = target.closest("[data-nav-url]");
      if (navUrlBtn) { navigateWithParams(navUrlBtn.dataset.navUrl); return true; }
      return false;
    }

    document.addEventListener("pointerdown", (e) => {
      if (e.pointerType === "mouse" && e.button !== 0) return;
      const now = Date.now();
      if (now - lastTapTs < 200) return;

      if (e.target && e.target.closest && handleInteractiveTarget(e.target)) {
        lastTapTs = now;
        e.preventDefault();
        return;
      }

      const x = e.clientX;
      const y = e.clientY;
      const allBtns = document.querySelectorAll("[data-sym], [data-choice], [data-nav-role], [data-nav-url]");
      for (const btn of allBtns) {
        const rect = btn.getBoundingClientRect();
        if (rect.width === 0 || rect.height === 0) continue;
        if (x >= rect.left && x <= rect.right && y >= rect.top && y <= rect.bottom) {
          lastTapTs = now;
          e.preventDefault();
          handleInteractiveTarget(btn);
          return;
        }
      }
    }, { capture: true, passive: false });

    document.addEventListener("click", (e) => {
      if (Date.now() - lastTapTs < 350) return;
      if (e.target && e.target.closest) handleInteractiveTarget(e.target);
    });

    const AUTO_RETURN_MS = 0;
    if (AUTO_RETURN_MS) {
      let idleTimer = null;
      function resetIdleTimer() {
        clearTimeout(idleTimer);
        idleTimer = setTimeout(() => { window.location.href = "index.html"; }, AUTO_RETURN_MS);
      }
      ["pointerdown", "touchstart", "click", "keydown"].forEach((ev) => {
        window.addEventListener(ev, resetIdleTimer, { passive: true });
      });
      resetIdleTimer();
    }

    function fitCanvas() {
      const canvas = document.getElementById("appCanvas");
      const scale = Math.min(window.innerWidth / 1080, window.innerHeight / 786);
      if (window.CSS && CSS.supports && CSS.supports("zoom", "1")) {
        canvas.style.zoom = scale;
        canvas.style.transform = "none";
      } else {
        canvas.style.zoom = "";
        canvas.style.transform = `scale(${scale})`;
      }
    }

    window.addEventListener("resize", fitCanvas);
    window.addEventListener("orientationchange", fitCanvas);

    const initSym = pageParams.get("sym");
    if (initSym && SYMPTOMS.some((s) => s.id === initSym)) {
      currentSymId = initSym;
    }
    const initChoice = pageParams.get("choice");
    const initSymObj = SYMPTOMS.find((s) => s.id === currentSymId);
    if (initChoice && initSymObj && initSymObj.check && initSymObj.check.choices.some((c) => c.id === initChoice)) {
      choiceState[currentSymId] = initChoice;
    }
    renderSymptomList();
    renderDetail();
    fitCanvas();
  </script>
</body>
</html>
